<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/x-icon" />
    <link rel="apple-touch-icon" href="./public/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Achieve Together" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Achieve Together</title>

    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem("setting_theme");
          const savedAccent = localStorage.getItem("settings_accent");
          const savedGrad = localStorage.getItem("settings_grad");

          const theme =
            savedTheme === "light" || savedTheme === "dark"
              ? savedTheme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";

          const accent = savedAccent || "poison";
          const grad = savedGrad || "meadow";

          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.setAttribute("data-accent", accent);
          document.documentElement.setAttribute("data-grad", grad);
        } catch (e) {
          console.error("Theme init error:", e);
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
