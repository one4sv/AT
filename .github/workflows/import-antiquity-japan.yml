            },
            {
              "id": "japaneseNinja",
              "device": "desktop",
              "filename": "japanese-ninja-desktop.webp",
              "url": "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/93ee7b1c-30db-4848-ade0-97c8797d3b2e/3fbbb539-fa20-476d-a95c-7e673ceceb32/ONE_standalone_16_9_native_wide_desktop_premium_richly_detai.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNmM4ZDhhNTNkYzk3ZThlNSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDE3MjExNX0.NOhXvkxCrqRxhfrlngx6wtKLnk9zXt47FoPxagfvjwk"
            },
            {
              "id": "japaneseSakura",
              "device": "desktop",
              "filename": "japanese-sakura-desktop.webp",
              "url": "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/2686f9af-9ac8-40a1-8501-514785ba9bc3/427b0ebe-0edc-495a-8a13-04e1694ab1bc/ONE_standalone_16_9_native_wide_desktop_premium_richly_detai.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOGVlZmNhYjNlYmFmYTJmMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDE0MzY2N30.yWTOsTlu67KH_mDZ6tG1MPQNlF9mOwVKr1z0ajoqJaE"
