name: Import Nano Banana Pro Antiquity and Japan originals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-antiquity-japan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebP tooling
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Download and validate Nano Banana Pro scene images
        run: |
          node --input-type=module <<'NODE'
          import sharp from "sharp";
          import { readFile, writeFile } from "node:fs/promises";
          const sources = [
            {
              "id": "greekStatue",
              "device": "desktop",
              "filename": "greekStatue-desktop.webp",
