            },
            {
              "id": "japaneseTorii",
              "device": "desktop",
              "filename": "japanese-torii-desktop.webp",
              "url": "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/7bd8ed15-92fa-4011-9e73-41442c03d12c/63f14815-9d44-41e8-98aa-482a5ef3c2d1/ONE_standalone_16_9_native_wide_desktop_premium_richly_detai.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDJmOGUyMjMxMTFhYzRlOSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDE1NzQ3NX0.9BykOQcAYkuGTSgVzRfqg8OQcRNH58pZJ05Ja6MlLKs"
            },
            {
              "id": "japaneseGarden",
              "device": "desktop",
              "filename": "japaneseGarden-desktop.webp",
              "url": "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/8620e5ac-a28b-49c2-9161-77aa8f5fcf49/8b2217d6-71aa-4675-9d72-991fd4b95112/ONE_standalone_16_9_native_wide_desktop_premium_richly_detai.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzU5ZDY2MmYwY2EzMDE0ZSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDA5MzM1OX0.kkvXdj8tO96umfG_vcbQKxWlYnrKWe1TvIfV7SVSE1E"
            },
            {
              "id": "greekStatue",
              "device": "mobile",
              "filename": "greekStatue-mobile.webp",
              "url": "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/b9c2ca9b-36c4-458f-ac35-3cb68135904d/90cdf0a7-fc1d-4c61-97d9-2d00bd2ca6b4/Create_ONE_standalone_beautiful_mobile_wallpaper_9_16_native.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODM5MGU5MTVmMDUzM2FlMyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDE0NzM0OX0.d-XpQJcJH5YqANQ8VLU5at-4I78vLeml30EVEOBiJgs"
            }
          ];
          const updated = [];
          for (const item of sources) {
              const response = await fetch(item.url, { signal: AbortSignal.timeout(90000) });
              if (!response.ok) throw new Error(item.filename + ": download HTTP " + response.status);
              const bytes = Buffer.from(await response.arrayBuffer());
              const meta = await sharp(bytes).metadata();
              const ratio = item.device === "desktop" ? 16 / 9 : 9 / 16;
              if (bytes.length < 150000 || meta.width < (item.device === "desktop" ? 1600 : 900) ||
                  meta.height < (item.device === "desktop" ? 900 : 1600) ||
                  Math.abs(meta.width / meta.height - ratio) > .06)
                  throw new Error("Unexpected image dimensions: " + item.filename + " " + meta.width + "x" + meta.height);
              const destination = "public/wallpapers/" + item.filename;
              await sharp(bytes).webp({ quality: 92, effort: 5 }).toFile(destination);
              const saved = await readFile(destination);
              const actual = await sharp(saved).metadata();
              if (saved.toString("ascii", 0, 4) !== "RIFF" || saved.toString("ascii", 8, 12) !== "WEBP" ||
                  saved.readUInt32LE(4) + 8 !== saved.length ||
                  actual.width !== meta.width || actual.height !== meta.height)
                  throw new Error("Corrupted output " + item.filename);
              console.log("VALIDATED " + item.filename + " " + actual.width + "x" + actual.height + " " + saved.length + " bytes");
              updated.push(item);
          }
          const file = "src/components/ts/utils/BackgroundScene.tsx";
          let content = await readFile(file, "utf8");
          for (const item of updated) {
              const marker = item.device + ': "/wallpapers/' + item.filename;
              const first = content.indexOf(marker);
              if (first < 0 || content.indexOf(marker, first + marker.length) !== -1)
                  throw new Error("Wallpaper mapping not unique: " + item.filename);
              const end = content.indexOf('"', first + marker.length);
              if (end < 0) throw new Error("Missing closing quote: " + item.filename);
              content = content.slice(0, first) + marker + '?v=20261107-nanobanana-pro"' + content.slice(end + 1);
          }
          await writeFile(file, content);
          console.log("Updated " + updated.length + " asset paths; unchanged mobile scenes retain originals");
          
          NODE
      - name: Commit validated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/wallpapers/greekStatue-desktop.webp
          git add public/wallpapers/greekTemple-desktop.webp
          git add public/wallpapers/greekGladiator-desktop.webp
          git add public/wallpapers/greekColumns-desktop.webp
          git add public/wallpapers/greekRuins-desktop.webp
          git add public/wallpapers/japanese-ninja-desktop.webp
          git add public/wallpapers/japanese-sakura-desktop.webp
          git add public/wallpapers/japanese-alley-desktop.webp
          git add public/wallpapers/japanese-torii-desktop.webp
          git add public/wallpapers/japaneseGarden-desktop.webp
          git add public/wallpapers/greekStatue-mobile.webp
          git add src/components/ts/utils/BackgroundScene.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Publish Nano Banana Pro Antiquity and Japan desktop wallpapers"
            git pull --rebase origin main
            git push
          fi
