name: Import Nano Banana Mythical World desktop wallpapers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-myth-wallpapers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image tooling
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Download and validate independent Nano Banana desktop originals
        run: |
          node --input-type=module <<'NODE'
          import sharp from "sharp";
          import { mkdir, readFile, writeFile } from "node:fs/promises";
          const sources = {
              "mythOlympus": "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/293ec8be-3640-494e-9f15-c90162b26333/284a0d5d-d6a3-4037-8dc4-6d38346ee95f/Recreate__mobile_as_one_standalone_premium_16_9_landscape_de.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMGFjYzI2ZDdkZDBkYjUzOCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDE1MzA0N30.0kfi6IkbLUSeQin6NK6Ys_A3hs6XgA6yFsio-TLVFSI",
              "mythDragon": "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/113a23df-eb29-41a2-9012-e93bde40dce3/3cc38f39-2264-4294-bbd0-20bdba38bdce/Use__mobile_as_the_source_of_identity__mood__color_palette_a.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODIwYzU2MjkzNWNkZGRmNiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDE2OTc2OX0.E2BdzVyN0ClsSV0akdRRbkSduVZ5hQwF_2xg2El2Fe0",
              "mythTree": "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/c4d259e7-4647-4ee5-83ce-4e694cdab689/88b70c4b-04ca-421a-aa70-a2c69f3b7070/Use__mobile_as_the_source_of_identity__mood__color_palette_a.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMGQ1YjY0MWE3MTMxYTY0OSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDE1NDAxMH0.W7iSzKmAZqqCptI5SSjpFFoAU3wm5_stzImi5wsfJdg",
              "mythUnderworld": "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/e3e99f70-fefc-46a9-9b23-ff6f4d5cf473/5c2681c2-5df0-4a17-9e8a-7cc0c7258705/Use__mobile_as_the_source_of_identity__mood__color_palette_a.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiN2I5YTIwMjAwMjY2ZGMxNiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDEwNzkzNn0._EsWkg8Ta4eRtaMhhNRuiO7aYVaXiFQTWcTxGZPVn8A",
              "mythPegasus": "https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/7b66a91c-5132-40de-8a37-21e85d9d5a59/2c9ccb41-f75d-4cf2-b4c3-387f5a6828b6/Use__mobile_as_the_source_of_identity__mood__color_palette_a.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMmJhMGRkYTEyYWI5ZGYyMyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsImV4cCI6MTc5NDE2NDM4NX0.xVhffBlhtz96GC_KkW5H8cfyoDslC-kRT1ZGXoceCQI"
          };
          await mkdir("public/wallpapers", { recursive: true });
          for (const [id, url] of Object.entries(sources)) {
              const response = await fetch(url, { signal: AbortSignal.timeout(90000) });
              if (!response.ok) throw new Error(id + " download HTTP " + response.status);
              const bytes = Buffer.from(await response.arrayBuffer());
              const meta = await sharp(bytes).metadata();
              if (bytes.length < 150000 || meta.width < 1600 || meta.height < 900 ||
                  Math.abs(meta.width / meta.height - 16 / 9) > .06)
                  throw new Error(id + " invalid original: " + meta.width + "x" + meta.height + ", " + bytes.length + " bytes");
              const output = "public/wallpapers/" + id + "-desktop.webp";
              await sharp(bytes).webp({ quality: 92, effort: 5 }).toFile(output);
              const saved = await readFile(output);
              const outputMeta = await sharp(saved).metadata();
              if (saved.toString("ascii", 0, 4) !== "RIFF" || saved.toString("ascii", 8, 12) !== "WEBP" ||
                  saved.readUInt32LE(4) + 8 !== saved.length ||
                  outputMeta.width !== meta.width || outputMeta.height !== meta.height)
                  throw new Error(id + " corrupted WebP output");
              console.log("Validated " + id + ": source " + meta.width + "x" + meta.height + ", optimized " + saved.length + " bytes");
          }
          const path = "src/components/ts/utils/BackgroundScene.tsx";
          let backgroundScene = await readFile(path, "utf8");
          for (const id of Object.keys(sources)) {
              const from = 'desktop: "/wallpapers/' + id + '-desktop.webp"';
              if (!backgroundScene.includes(from)) throw new Error("Unknown scene mapping: " + id);
              backgroundScene = backgroundScene.replace(from, 'desktop: "/wallpapers/' + id + '-desktop.webp?v=20261107-nanobanana"');
          }
          await writeFile(path, backgroundScene);
          console.log("Updated five desktop asset cache keys; mobile paths untouched");
          
          NODE
      - name: Commit five validated WebP images and cache version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/wallpapers/mythOlympus-desktop.webp public/wallpapers/mythDragon-desktop.webp
          git add public/wallpapers/mythTree-desktop.webp public/wallpapers/mythUnderworld-desktop.webp public/wallpapers/mythPegasus-desktop.webp
          git add src/components/ts/utils/BackgroundScene.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Replace five Mythical World desktop images with Nano Banana originals"
            git pull --rebase origin main
            git push
          fi
