name: Client checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install client dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Check release and RU/EN key parity
        run: npm run check:release
      - name: Check lazy page and modal style ownership
        run: npm run check:lazy-styles
      - name: Verify SelectList and contact picker styles
        run: node --test tests/select-list-modal-styles.test.mjs
      - name: Verify combined activity / plan chronology
        run: node --test tests/day-timeline.test.mjs
      - name: Verify media, SMnav skeletons and start-of-day logic
        run: node --test tests/overview-loading.test.mjs
      - name: Verify GroupInfo avatar/status positioning
        run: node --test tests/group-info-styles.test.mjs
      - name: Verify own forwarded message and profile/post colors
        run: node --test tests/profile-message-post-colors.test.mjs
      - name: Run Web Push service worker tests
        run: node --test tests/web-push-sw.test.mjs
      - name: Check stale asset recovery and checkbox semantics
        run: node --test tests/vite-chunk-recovery.test.mjs
      - name: Verify gradient text colors
        run: node --test tests/gradient-text.test.mjs
      - name: Verify solid accent and activity role text contrast
        run: node --test tests/accent-text-contrast.test.mjs
      - name: Build client
        run: npm run build
      - name: Enforce entry JavaScript budget
        run: npm run check:bundle
      - name: Install Playwright
        run: |
          npm install --prefix tests/e2e --no-audit --no-fund
          cd tests/e2e
          npx playwright install --with-deps chromium firefox webkit
      - name: Run public Chromium smoke tests
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/at-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/info/roadmap > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:5173/info/roadmap > /dev/null || { cat /tmp/at-vite.log; exit 1; }
          npm run test --prefix tests/e2e -- --project=chromium-desktop smoke.spec.ts settings.spec.ts
          npm run test --prefix tests/e2e -- --project=firefox-desktop --project=webkit-mobile settings.spec.ts
      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-smoke-failures
          path: tests/e2e/test-results/
          if-no-files-found: ignore
